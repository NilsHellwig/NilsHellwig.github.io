<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="sheen" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceff1"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g stroke="#6b7280" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M256 150 L160 262"/><path d="M256 150 L352 262"/>
      <path d="M160 262 L110 366"/><path d="M160 262 L210 366"/><path d="M352 262 L302 366"/><path d="M352 262 L402 366"/>
    </g>
    <g filter="url(#softshadow)">
      <ellipse cx="256" cy="140" rx="62" ry="40" fill="#ffffff" stroke="#374151" stroke-width="9"/>
      <ellipse cx="160" cy="262" rx="50" ry="34" fill="#ffffff" stroke="#374151" stroke-width="9"/>
      <ellipse cx="352" cy="262" rx="50" ry="34" fill="#ffffff" stroke="#374151" stroke-width="9"/>
      <rect x="76" y="352" width="68" height="52" rx="12" fill="#ef4444"/>
      <rect x="176" y="352" width="68" height="52" rx="12" fill="#22c55e"/>
      <rect x="268" y="352" width="68" height="52" rx="12" fill="#ef4444"/>
      <rect x="368" y="352" width="68" height="52" rx="12" fill="#ef4444"/>
    </g>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#000000" stroke-opacity="0.07" stroke-width="3"/>
  </g>
</svg>
