    <circle cx="378" cy="384" r="62" fill="#111827" filter="url(#shadow)"/>
    <g fill="#ffffff" transform="translate(340.0 346.0) scale(0.2969)" ><path d="M228,144v64a12,12,0,0,1-12,12H40a12,12,0,0,1-12-12V144a12,12,0,0,1,24,0v52H204V144a12,12,0,0,1,24,0Zm-108.49,8.49a12,12,0,0,0,17,0l40-40a12,12,0,0,0-17-17L140,115V32a12,12,0,0,0-24,0v83L96.49,95.51a12,12,0,0,0-17,17Z"/></g>
