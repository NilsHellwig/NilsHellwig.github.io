    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g opacity="0.5">
      <rect x="70" y="80" width="140" height="14" rx="7" fill="#a855f7"/><rect x="222" y="80" width="90" height="14" rx="7" fill="#94a3b8"/>
      <rect x="70" y="112" width="96" height="14" rx="7" fill="#3b82f6"/><rect x="178" y="112" width="170" height="14" rx="7" fill="#cbd5e1"/>
    </g>
    <circle cx="186" cy="262" r="74" fill="#0063dc"/>
